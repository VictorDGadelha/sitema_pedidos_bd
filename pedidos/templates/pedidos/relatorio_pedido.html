<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Relatório de Vendas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<a href="/pedidos/"
   class="btn btn-secondary mb-3">

    Voltar
</a>

<body class="container mt-5">

    <h1 class="mb-4">
        Relatório de Vendas
    </h1>

<form method="GET" class="row mb-4">

    <div class="col-md-3">

        <input
            type="text"
            name="cliente"
            class="form-control"
            placeholder="Cliente"
            value="{{ request.GET.cliente }}"
        >

    </div>

    <div class="col-md-3">

        <input
            type="text"
            name="produto"
            class="form-control"
            placeholder="Produto"
            value="{{ request.GET.produto }}"
        >

    </div>

    <div class="col-md-3">

        <select
            name="status"
            class="form-select"
        >

            <option value="">
                Todos Status
            </option>

            <option value="EM_PREPARO">
                Em preparo
            </option>

            <option value="FINALIZADO">
                Finalizado
            </option>

            <option value="CANCELADO">
                Cancelado
            </option>

        </select>

    </div>

    <div class="col-md-3">

        <button
            type="submit"
            class="btn btn-primary w-100">

            Pesquisar
        </button>

    </div>

</form>

    <table class="table table-dark table-striped">

        <thead>

            <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Subtotal</th>
                <th>Data</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody>

            {% for item in relatorio %}

            <tr>

                <td>
                    {{ item.pedido_id }}
                </td>

                <td>
                    {{ item.cliente }}
                </td>

                <td>
                    {{ item.produto }}
                </td>

                <td>
                    {{ item.quantidade }}
                </td>

                <td>
                    R$ {{ item.subtotal }}
                </td>

                <td>
                    {{ item.data_pedido }}
                </td>

                <td>
                    {{ item.status }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
