<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Novo Pedido</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card bg-dark text-white shadow">

                <div class="card-body">

                    <h1 class="mb-4">
                        Novo Pedido
                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Salvar Pedido
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
